<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>待办事项</title>
  <style>
    :root{color-scheme:light;--bg:#f7f5ef;--card:#fff;--ink:#24231f;--muted:#77736b;--line:#e8e4da;--accent:#5b63d3;--danger:#c84b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{width:min(720px,calc(100% - 32px));margin:0 auto;padding:64px 0 48px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:13px}h1{font-size:clamp(32px,7vw,48px);line-height:1.1;margin:8px 0 28px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 35px #332b1510}.add{display:flex;gap:10px;margin-bottom:20px}.add input{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;outline:none}.add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #5b63d322}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.filters{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:4px}.filters button{background:transparent;color:var(--muted);padding:6px 10px;font-weight:500}.filters button.active{background:#eeeefe;color:var(--accent);font-weight:700}.count{margin-left:auto;color:var(--muted);font-size:14px}.list{list-style:none;padding:0;margin:0}.item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none}.title{flex:1;overflow-wrap:anywhere}.done .title{text-decoration:line-through;color:#aaa59b}.delete{background:transparent;color:var(--muted);font-size:20px;padding:2px 7px}.delete:hover{color:var(--danger)}.empty,.error{text-align:center;padding:32px 10px;color:var(--muted)}.error{color:var(--danger)}@media(max-width:480px){main{padding-top:36px}.panel{padding:14px}.add{flex-wrap:wrap}.add input{flex-basis:100%}.add button{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">CLOUDFLARE WORKERS · D1</div>
    <h1>我的待办</h1>
    <section class="panel" aria-label="待办事项">
      <form class="add" id="add-form"><input id="new-title" maxlength="200" autocomplete="off" placeholder="接下来要做什么？" aria-label="新的待办事项"><button type="submit">添加</button></form>
      <div class="filters"><button type="button" class="active" data-filter="all">全部</button><button type="button" data-filter="active">未完成</button><button type="button" data-filter="completed">已完成</button><span class="count" id="count"></span></div>
      <ul class="list" id="list"><li class="empty">正在加载…</li></ul>
    </section>
  </main>
  <script>
    const list=document.querySelector('#list'),form=document.querySelector('#add-form'),input=document.querySelector('#new-title'),count=document.querySelector('#count');let todos=[],filter='all';
    const api=async(path='',options={})=>{const r=await fetch('/api/todos'+path,{headers:{'Content-Type':'application/json'},...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'请求失败');return data};
    function render(){const shown=todos.filter(t=>filter==='all'||(filter==='active'&&!t.completed)||(filter==='completed'&&t.completed));count.textContent=`${todos.filter(t=>!t.completed).length} 项未完成`;list.innerHTML=shown.length?shown.map(t=>`<li class="item ${t.completed?'done':''}"><input type="checkbox" ${t.completed?'checked':''} data-toggle="${t.id}" aria-label="标记完成"><span class="title">${escapeHtml(t.title)}</span><button class="delete" data-delete="${t.id}" aria-label="删除">×</button></li>`).join(''):'<li class="empty">这里还没有待办事项</li>'}
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    async function load(){try{todos=await api();render()}catch(e){list.innerHTML=`<li class="error">${escapeHtml(e.message)}</li>`}}
    form.addEventListener('submit',async e=>{e.preventDefault();const title=input.value.trim();if(!title)return;const b=form.querySelector('button');b.disabled=true;try{const todo=await api('',{method:'POST',body:JSON.stringify({title})});todos.unshift(todo);input.value='';render()}catch(e){alert(e.message)}finally{b.disabled=false}});
    list.addEventListener('click',async e=>{const toggle=e.target.dataset.toggle,del=e.target.dataset.delete;try{if(toggle){const t=todos.find(x=>x.id==toggle);Object.assign(t,await api('/'+toggle,{method:'PATCH',body:JSON.stringify({completed:!t.completed})}));render()}else if(del){await api('/'+del,{method:'DELETE'});todos=todos.filter(t=>t.id!=del);render()}}catch(err){alert(err.message)}});
    document.querySelector('.filters').addEventListener('click',e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===e.target));render()});load();
  </script>
</body>
</html>
