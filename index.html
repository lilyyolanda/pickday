const $=id=>document.getElementById(id),api=async(path='',options={})=>{const r=await fetch('/api/todos'+path,{headers:{'Content-Type':'application/json'},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},today=()=>iso(new Date()),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=s=>{const d=parse(s);return new Intl.DateTimeFormat(lang(),{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d)};
const I18N={'zh-CN':{tag:'拾起每一天的小事，留住时间。',input:'记下一件此刻想留住的小事',add:'添加',today:'今天',empty:'今天还没有记录。<br>也没关系，慢慢来。',prompt:'今天想留下些什么？',done:n=>`已经留下 ${n} 件小事`,sub:'不必完成什么，想记就记一点。',years:'这一天，曾经留下过',note:'偶尔回望就好，不必把每一年都填满。',recent:'上个月的这一天',edit:'修改这件小事',cancel:'取消',save:'保存',changed:'已保存',added:'已记下这件小事',deleted:'已删除',prev:'上一天',next:'下一天'},'zh-TW':{tag:'拾起每天的小事，留住時間。',input:'記下一件此刻想留下的小事',add:'新增',today:'今天',empty:'今天還沒有記錄。<br>也沒關係，慢慢來。',prompt:'今天想留下什麼？',done:n=>`已經留下 ${n} 件小事`,sub:'不必完成什麼，想記就記一點。',years:'這一天，曾經留下過',note:'偶爾回望就好，不必把每一年都填滿。',recent:'上個月的這一天',edit:'修改這件小事',cancel:'取消',save:'儲存',changed:'已儲存',added:'已記下這件小事',deleted:'已刪除',prev:'前一天',next:'後一天'},en:{tag:'Gather the small things. Keep the days.',input:'Keep one small thing from today',add:'Add',today:'Today',empty:'Nothing recorded today.<br>That is all right. Take your time.',prompt:'What would you like to keep from today?',done:n=>`${n} small ${n===1?'thing':'things'} kept`,sub:'Nothing to complete. Write only if you feel like it.',years:'Once, on this day',note:'A gentle look back. No year needs to be filled.',recent:'This day last month',edit:'Edit this note',cancel:'Cancel',save:'Save',changed:'Saved',added:'This small thing was kept',deleted:'Deleted',prev:'Previous day',next:'Next day'},ja:{tag:'毎日の小さなことを拾い、時間を残す。',input:'今日、残しておきたいこと',add:'追加',today:'今日',empty:'今日はまだ記録がありません。<br>それでも大丈夫。ゆっくりと。',prompt:'今日は何を残しますか？',done:n=>`${n}つの小さなことを残しました`,sub:'無理に書かなくても大丈夫。思いついたときに。',years:'この日に、残したこと',note:'ときどき振り返るだけで十分です。',recent:'先月の今日',edit:'この記録を編集',cancel:'キャンセル',save:'保存',changed:'保存しました',added:'記録しました',deleted:'削除しました',prev:'前の日',next:'次の日'},ko:{tag:'매일의 작은 일을 모아 시간을 남겨요.',input:'오늘 간직하고 싶은 한 가지',add:'추가',today:'오늘',empty:'��늘은 아직 기록이 없어요.<br>괜찮아요. 천천히.',prompt:'오늘 무엇을 남기고 싶나요?',done:n=>`작은 기록 ${n}개를 남겼어요`,sub:'꼭 쓰지 않아도 괜찮아요. 마음이 갈 때 적어 보세요.',years:'이날, 남겨 둔 것',note:'가끔 돌아보는 것만으로 충분해요.',recent:'지난달 오늘',edit:'이 기록 수정',cancel:'취소',save:'저장',changed:'저장했어요',added:'기록했어요',deleted:'삭제했어요',prev:'전날',next:'다 const prompts={ 'zh-CN':['今天有什么小事，值得被轻轻记住？','此刻的你，正在经历什么？','如果只写一句话，今天会是什么？','今天有没有一个让你微笑的瞬间？','把今天留下一小片就好。','今天的空气、光线或声音是什么样的？','今天完成了什么，也可以只是好好休息。','有什么念头，想留给未来的自己？','今天哪里让你觉得安心？','慢慢写，今天不必解释完整。','你今天遇见了什么？','哪一刻让今天变得特别？','记下一件此刻正在发生的事。','今天的你，想对明天说什么？','平凡的一天，也值得有一个小小的注脚。','今天有没有好好照顾自己？','把一件小事放进时间里。','今天的心情像什么天气？','不必写得漂亮，真实就很好。','在今天和未来之间，放下一句话。'], 'zh-TW':['今天有什麼小事，值得被輕輕記住？','此刻的你，正在經歷什麼？','如果只寫一句話，今天會是什麼？','今天有沒有一個讓你微笑的瞬間？','把今天留下一小片就好。','今天的空氣、光線或聲音是什麼樣的？','今天完成了什麼，也可以只是好好休息。','有什麼念頭，想留給未來的自己？','今天哪裡讓你覺得安心？','慢慢寫，今天不必解釋完整。','你今天遇見了什麼？','哪一刻讓今天變得特別？','記下一件此刻正在發生的事。','今天的你，想對明天說什麼？','平凡的一天，也值得有一個小小的註腳。','今天有沒有好好照顧自己？','把一件小事放進時間裡。','今天的心情像什麼天氣？','不必寫得漂亮，真實就很好。','在今天和未來之間，放下一句話。'],en:['What small thing from today is worth keeping?','What are you moving through right now?','If today were one sentence, what would it say?','Was there a moment that made you smile?','Keep only a small piece of today.','What did today sound, feel, or look like?','What did you do today, even if it was resting?','What thought would you leave for your future self?','Where did you feel at ease today?','Write slowly. Today needs no explanation.','Who or what did you meet today?','Which moment made today distinct?','Keep one thing that is happening now.','What would today say to tomorrow?','An ordinary day still deserves a small note.','How did you care for yourself today?','Place one small thing inside time.','What weather is your mood today?','It need not be beautiful. Real is enough.','Leave one sentence between today and tomorrow.'],ja:['今日、そっと残しておきたい小さなことは？','今のあなたは、何を感じていますか？','今日を一文にするなら、どんな言葉？','今日、笑顔になった瞬間はありましたか？','今日の一片だけ、残しておきましょう。','今日の空気や光、音はどんなものでしたか？','今日できたこと。休めたことでも十分です。','未来の自分に残したい考えは？','今日はどこで安心しましたか？','ゆっくり書けば大丈夫。','今日、何に出会いましたか？','今日を特別にした瞬間は？','今起きていることを一つ残しましょう。','今日から明日へ、何を伝えたいですか？','何気ない日にも、小さな印を。','今日は自分をいたわれましたか？','小さなことを時間の中へ。','今日の気分はどんな天気？','きれいに書かなくて大丈夫。','今日と未来の間に一言を。'],ko:['오늘의 작은 일 중 간직하고 싶은 것은 무��인가요?','지금 나는 무엇을 지나고 있나요?','오늘을 한 문장으로 남긴다면?','오늘 미소 지었던 function lang(){return localStorage.getItem('pickday-lang')||'zh-CN'}function t(){return I18N[lang()]||I18N['zh-CN']}function holiday(s){const d=parse(s),md=`${d.getMonth()+1}-${d.getDate()}`,y=d.getFullYear(),cn={'zh-CN':{'12-31':'跨年夜，给这一年留一句话。','1-1':'新年第一天，慢慢写下此刻。','12-25':'圣诞快乐，今天有什么温柔的片段？'},'zh-TW':{'12-31':'跨年夜，為這一年留下一句話。','1-1':'新年的第��天，慢慢寫下此刻。','12-25':'聖誕快樂，今天有什麼溫柔的片段？'},en:{'12-31':'New Year’s Eve. Leave one gentle line for this year.','1-1':'The first day of a new year. Begin softly.','12-25':'Merry Christmas. What gentle moment did today hold?'},ja:{'12-31':'大晦日。今年にそっと一言残しましょう。','1-1':'新しい年のはじまり。ゆっくり始めましょう。','12-25':'メリークリスマス。今日のやさしい瞬間は？'},ko:{'12-31':'한 해의 마지막 밤, 올해에 한마디 남겨 보세요.','1-1':'새해 첫날, 천천히 시작해요.','12-25':'메리 크리스마스. 오늘의 따뜻한 순간은?'}};const lunar={2024:['2-9','2-10'],2025:['1-28','1-29'],2026:['2-16','2-17'],2027:['2-5','2-6'],2028:['1-25','1-26'],2029:['2-12','2-13'],2030:['2-2','2-3'],2031:['1-22','1-23'],2032:['2-10','2-11'],2033:['1-30','1-31'],2034:['2-18','2-19'],2035:['2-7','2-8']};const lunarText={ 'zh-CN':['除夕，和这一年的自己轻轻道别。','正月初一，新的一年从容开始。'],'zh-TW':['除夕，和這一年的自己輕輕道別。','正月初一，新的一年從容開始。'],en:['Lunar New Year’s Eve. Say goodbye to this year gently.','The first day of the lunar year. Begin at your own pace.'],ja:['旧正月の前夜。今年の自分にそっと別れを告げましょう。','旧正月。自分のペースで始めましょう。'],ko:['설날 전날, 올해의 나에게 다정히 인사를 건네요.','음력 새해 첫날, 나만의 속도로 시작해요.']};if(cn[lang()][md])return cn[lang()][md];if(lunar[y]){const i=lunar[y].indexOf(`${d.getMonth()+1}-${d.getDate()}`);if(i>=0)return lunarText[lang()][i]}return null}
let selectedDate=today(),todos=[],editingId=null;const dayTodos=(d=selectedDate)=>todos.filter(x=>String(x.created_at||'').slice(0,10)===d);function monthBefore(s){const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)}function promptText(){const h=holiday(selectedDate);if(h)return h;const list=prompts[lang()]||prompts['zh-CN'],last=sessionStorage.getItem('pickday-prompt'),choices=list.filter(x=>x!==last),v=choices[Math.floor(Math.random()*choices.length)];sessionStorage.setItem('pickday-prompt',v);return v}
function renderHeader(){const a=dayTodos(),d=parse(selectedDate),q=t();$('dateNumber').textContent=new Intl.DateTimeFormat(lang(),{month:'long',day:'numeric'}).format(d);$('dateMeta').textContent=fmt(selectedDate);$('prompt').textContent=a.length?q.done(a.length):promptText();$('subprompt').textContent=a.length?'':q.sub;$('tagline').textContent=q.tag;$('recordInput').placeholder=q.input;$('homeNav').textContent=q.today;$('editTitle').textContent=q.edit;$('cancelModal').textContent=q.cancel;$('saveModal').textContent=q.save}
function actions(x){return `<div class="entry-actions"><button class="mini-btn" data-edit="${x.id}">${t().edit}</button><button class="mini-btn" data-del="${x.id}">${t().deleted}</button></div>`}function renderToday(){const a=dayTodos();$('todayList').innerHTML=a.length?a.map(x=>`<div class="today-item"><span class="dot"></span><div class="entry-text">${esc(x.title)}<div class="entry-time">${esc(x.created_at||'')}</div></div>${actions(x)}</div>`).join(''):`<div class="empty">${t().empty}</div>`;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeTodo(b.dataset.del));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit))}
function renderMemories(){const d=parse(selectedDate),current=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();let html='',found=0;for(let i=1;i<=Math.min(5,current-1900);i++){const y=current-i,s=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,a=todos.filter(x=>String(x.created_at||'').slice(0,10)===s);if(!a.length)continue;found++;html+=`<div class="year-card"><div class="year-head"><span class="year">${y}</span><span class="year">${a.length}</span></div><div class="memory">${a.slice(0,3).map(x=>esc(x.title)).join(' · ')}</div></div>`}$('years').innerHTML=html;$('yearsSection').style.display=found?'block':'none';$('yearsTitle').textContent=t().years;$('yearsNote').textContent=t().note;const rs=monthBefore(selectedDate),recent=dayTodos(rs);$('recentTitle').textContent=t().recent;$('recentNote').textContent=fmt(rs);$('recentList').innerHTML=recent.map(x=>`<div class="recent-card"><div class="recent-memory">${esc(x.title)}</div><div class="entry-time">${esc(x.created_at||'')}</div></div>`).join('');$('recentSection').style.display=recent.length?'block':'none';$('memorySection').style.display=found||recent.length?'block':'none'}function render(){renderHeader();renderToday();renderMemories()}async function load(){try{todos=await api();render()}catch(e){$('todayList').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}$('recordForm').onsubmit=async e=>{e.preventDefault();const input=$('recordInput'),title=input.value.trim();if(!title)return;try{const x=await api('',{method:'POST',body:JSON.stringify({title})});todos.unshift(x);input.value='';render();toast(t().added)}catch(e){toast(e.message)}};async function removeTodo(id){try{await api('/'+id,{method:'DELETE'});todos=todos.filter(x=>String(x.id)!==String(id));render();toast(t().deleted)}catch(e){toast(e.message)}}function openEdit(id){const x=todos.find(t=>String(t.id)===String(id));if(!x)return;editingId=id;$('modalDate').textContent=fmt(String(x.created_at).slice(0,10));$('modalText').value=x.title;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');editingId=null}$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('saveModal').onclick=async()=>{const title=$('modalText').value.trim();if(!title)return;try{const x=await api('/'+editingId,{method:'PATCH',body:JSON.stringify({title})}),old=todos.find(v=>String(v.id)===String(editingId));if(old)Object.assign(old,x);closeModal();render();toast(t().changed)}catch(e){toast(e.message)}};function move(n){const d=parse(selectedDate);d.setDate(d.getDate()+n);selectedDate=iso(d);render();scrollTo(0,0)}$('prevDay').onclick=()=>move(-1);$('nextDay').onclick=()=>move(1);$('todayBtn').onclick=()=>{selectedDate=today();render();scrollTo(0,0)};$('homeNav').onclick=()=>$('todayBtn').click();$('language').value=lang();$('language').onchange=e=>{localStorage.setItem('pickday-lang',e.target.value);document.documentElement.lang=e.target.value;render()};function toast(v){const x=$('toast');x.textContent=v;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)}$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';$('theme').textContent=dark?'☼':'☾';localStorage.setItem('pickday-theme',dark?'':'dark')};if(localStorage.getItem('pickday-theme')==='dark'){document.documentElement.dataset.theme='dark';$('theme').textContent='☾'}document.documentElement.lang=lang();load();
</script></body></html>
