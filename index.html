<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f0">
  <title>拾日</title>
  <style>
    :root{--bg:#f8f6f0;--paper:#fffdf8;--text:#42463e;--muted:#a1a197;--line:#ebe8df;--soft:#f1efe8;--sage:#778b7d;--sage2:#e9efe9;--accent:#607567;--shadow:0 16px 50px rgba(70,70,55,.055)}
    [data-theme=dark]{--bg:#1e211e;--paper:#292c28;--text:#eeeae0;--muted:#9a9c95;--line:#3a3d38;--soft:#32352f;--sage:#a6b7a9;--sage2:#354238;--accent:#b8c8ba;--shadow:0 16px 50px rgba(0,0,0,.2)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans",sans-serif}.app{width:min(650px,100%);margin:auto;padding:34px 22px 90px}.top{display:flex;justify-content:space-between;margin-bottom:62px}.brand,.date-number,.prompt,.memory,.memory-title,.recent-title{font-family:"Songti SC","STSong","Noto Serif SC",serif}.brand{font-size:31px;letter-spacing:3px}.tagline,.date-meta,.memory-note,.recent-note,.quiet-note{color:var(--muted);font-size:11px}.tagline{margin-top:8px}.theme{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--text)}.date{text-align:center}.date-number{font-size:48px;line-height:1}.date-meta{margin-top:13px}.date-nav{display:flex;justify-content:center;gap:8px;margin-top:20px}.round{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:20px}.round:hover{background:var(--soft);color:var(--text)}.hero{margin-top:55px;text-align:center}.prompt{font-size:22px;line-height:1.6}.subprompt{font-size:12px;color:var(--muted);margin-top:6px}.record-box{margin:27px auto 0;max-width:560px;border-bottom:1px solid var(--line);display:flex;padding:4px 0 8px}.record-box input{flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:10px 5px;font-size:14px}.record-box button{border:0;background:var(--accent);color:#fff;border-radius:50%;width:34px;height:34px;font-size:17px}.today-list{display:grid;gap:2px;max-width:560px;margin:27px auto 0;text-align:left}.today-item{display:flex;gap:12px;padding:10px 4px}.dot{width:5px;height:5px;border-radius:50%;background:var(--sage);margin-top:9px}.entry-text{font-size:14px;line-height:1.75;flex:1;word-break:break-word}.entry-time{font-size:10px;color:var(--muted)}.entry-actions{opacity:0}.today-item:hover .entry-actions{opacity:1}.mini-btn{border:0;background:transparent;color:var(--muted);font-size:11px}.empty{font-size:12px;color:var(--muted);padding:14px 0}.memory-section{margin-top:78px}.memory-title,.recent-title{text-align:center;font-size:20px}.memory-note,.recent-note{text-align:center;margin-top:8px}.years{margin-top:25px}.year-card,.recent-card{padding:20px 7px;border-top:1px solid var(--line)}.year-head{display:flex;justify-content:space-between}.year{font-size:12px;color:var(--muted)}.memory{font-size:14px;line-height:1.8;margin-top:8px}.empty-memory{font-size:12px;color:var(--muted);margin-top:8px}.memory-more{font-size:11px;color:var(--muted)}.recent-section{margin-top:35px}.recent-list{margin-top:20px}.recent-label{font-size:12px;color:var(--muted)}.recent-date{font-size:10px;color:var(--muted);margin-top:5px}.recent-memory{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:14px;line-height:1.8;margin-top:8px}.quiet-note{text-align:center;margin-top:32px;line-height:1.9}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(650px,100%);padding:8px 20px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);text-align:center}.bottom button{border:0;background:transparent;color:var(--sage);font-size:11px}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:rgba(25,28,24,.42);display:none;align-items:flex-end;justify-content:center;padding:15px}.modal.show{display:flex}.sheet{width:min(580px,100%);background:var(--paper);border-radius:26px;padding:22px}.sheet-top{display:flex;justify-content:space-between}.sheet h3{margin:0;font-family:"Songti SC","STSong","Noto Serif SC",serif}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.sheet textarea{width:100%;min-height:120px;margin-top:16px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:16px;padding:13px}.sheet-actions{text-align:right;margin-top:12px}.sheet-actions button{border:0;border-radius:12px;padding:10px 16px}.cancel{background:var(--soft);color:var(--text)}.save{background:var(--accent);color:#fff}@media(max-width:520px){.app{padding-top:25px}.top{margin-bottom:48px}.date-number{font-size:43px}.hero{margin-top:45px}.prompt{font-size:20px}.entry-actions{opacity:1}.memory-section{margin-top:62px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div><div class="brand">拾日</div><div class="tagline">拾起每一天的小事，留住时间。</div></div><button class="theme" id="theme">☼</button></header>
    <section class="date"><div class="date-number" id="dateNumber"></div><div class="date-meta" id="dateMeta"></div><div class="date-nav"><button class="round" id="prevDay">‹</button><button class="round" id="todayBtn">今</button><button class="round" id="nextDay">›</button></div></section>
    <section class="hero"><div class="prompt" id="prompt"></div><div class="subprompt" id="subprompt"></div><form class="record-box" id="recordForm"><input id="recordInput" maxlength="200" autocomplete="off" placeholder="写下一件今天的小事……"><button aria-label="添加">＋</button></form><div class="today-list" id="todayList"></div></section>
    <section class="memory-section"><div class="memory-title">往年的今天</div><div class="memory-note">同一天 · 不同的时间</div><div class="years" id="years"></div><div class="recent-section" id="recentSection"></div><div class="quiet-note" id="quietNote"></div></section>
  </main>
  <nav class="bottom"><button id="homeNav">今天</button></nav><div class="toast" id="toast"></div>
  <div class="modal" id="modal"><div class="sheet"><div class="sheet-top"><h3>修改这件小事</h3><button class="close" id="closeModal">×</button></div><div id="modalDate" class="date-meta"></div><textarea id="modalText" maxlength="200"></textarea><div class="sheet-actions"><button class="cancel" id="cancelModal">取消</button><button class="save" id="saveModal">保存</button></div></div></div>
  <script>
    const $=id=>document.getElementById(id),quiet=['这里还没有故事。<br>慢慢来，日子会留下东西。','今天还很安静。<br>慢慢来，日子会自己留下痕迹。','这一页还空着。<br>也许下一次回来，会多一件小事。'];let selectedDate=isoToday(),editingId=null,todos=[];
    const api=async(path='',options={})=>{const r=await fetch('/api/todos'+path,{headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d};
    function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function isoToday(){return localISO(new Date())}function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtMeta(s){const d=parseISO(s),w=new Intl.DateTimeFormat('zh-CN',{weekday:'long'}).format(d);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${w}`}function dayTodos(){return todos.filter(x=>String(x.created_at||'').slice(0,10)===selectedDate)}
    function renderHeader(){const a=dayTodos(),d=parseISO(selectedDate);$('dateNumber').textContent=`${d.getMonth()+1}月${d.getDate()}日`;$('dateMeta').textContent=fmtMeta(selectedDate);$('prompt').textContent=!a.length?'今天，有什么值得留下？':a.length===1?'再拾一件？':a.length===2?'今天还有什么小事？':'今天已经被你好好留下了。';$('subprompt').textContent=!a.length?'一两句话就很好。':a.length<3?'不用写很多，记住就好。':'这些小事，以后会回来找你。'}
    function renderToday(){const a=dayTodos();$('todayList').innerHTML=a.length?a.map(x=>`<div class="today-item"><span class="dot"></span><div class="entry-text">${esc(x.title)}<div class="entry-time">${esc(x.created_at||'')}</div></div><div class="entry-actions"><button class="mini-btn" data-edit="${x.id}">编辑</button><button class="mini-btn" data-del="${x.id}">删除</button></div></div>`).join(''):'<div class="empty">还没有留下今天的小事。</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeTodo(b.dataset.del));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit))}
    function renderYears(){const d=parseISO(selectedDate),current=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();let html='',found=0;for(let i=1;i<=Math.min(10,current-1900);i++){const y=current-i,s=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,a=todos.filter(x=>String(x.created_at||'').slice(0,10)===s);if(a.length)found++;html+=`<div class="year-card"><div class="year-head"><span class="year">${y}</span><span class="year">${a.length?`${a.length} 件记录`:''}</span></div>${a.length?`<div class="memory">${esc(a.slice(0,3).map(x=>x.title).join(' · '))}</div>`:'<div class="empty-memory">这一年的今天，还没有留下记录。</div>'}</div>`}$('years').innerHTML=html;$('quietNote').innerHTML=found?'这些年，你在这一天留下了 '+found+' 年的片段。':quiet[Math.floor(Math.random()*quiet.length)]}
    function render(){renderHeader();renderToday();renderYears()}
    async function load(){try{todos=await api();render()}catch(e){$('todayList').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    $('recordForm').onsubmit=async e=>{e.preventDefault();const input=$('recordInput'),title=input.value.trim();if(!title)return;try{const x=await api('',{method:'POST',body:JSON.stringify({title})});todos.unshift(x);input.value='';render();toast('今天，已经被你拾起一件小事')}catch(e){toast(e.message)}};
    async function removeTodo(id){try{await api('/'+id,{method:'DELETE'});todos=todos.filter(x=>String(x.id)!==String(id));render();toast('已放回今天的记忆')}catch(e){toast(e.message)}}
    function openEdit(id){const x=todos.find(t=>String(t.id)===String(id));if(!x)return;editingId=id;$('modalDate').textContent=fmtMeta(String(x.created_at).slice(0,10));$('modalText').value=x.title;$('modal').classList.add('show')}
    $('saveModal').onclick=async()=>{const title=$('modalText').value.trim();if(!title)return;try{const x=await api('/'+editingId,{method:'PATCH',body:JSON.stringify({title})});const old=todos.find(t=>String(t.id)===String(editingId));if(old)Object.assign(old,x);closeModal();render();toast('已保存')}catch(e){toast(e.message)}};function closeModal(){$('modal').classList.remove('show');editingId=null}$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;
    function moveDay(n){const d=parseISO(selectedDate);d.setDate(d.getDate()+n);selectedDate=localISO(d);render();scrollTo(0,0)}$('prevDay').onclick=()=>moveDay(-1);$('nextDay').onclick=()=>moveDay(1);$('todayBtn').onclick=()=>{selectedDate=isoToday();render();scrollTo(0,0)};$('homeNav').onclick=()=>{$('todayBtn').click()};$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';localStorage.setItem('shiri-theme-v1',dark?'':'dark');$('theme').textContent=dark?'☼':'☾'};if(localStorage.getItem('shiri-theme-v1')==='dark'){document.documentElement.dataset.theme='dark';$('theme').textContent='☾'}function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)}load();
  </script>
</body>
</html>
