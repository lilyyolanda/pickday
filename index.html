<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6f0"><title>拾日</title>
<style>
:root{--bg:#f8f6f0;--paper:#fffdf8;--text:#42463e;--muted:#a1a197;--line:#ebe8df;--soft:#f1efe8;--sage:#778b7d;--accent:#607567;--font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans",sans-serif;--font-reading:"Songti SC","Noto Serif SC",serif}[data-theme=dark]{--bg:#1e211e;--paper:#292c28;--text:#eeeae0;--muted:#9a9c95;--line:#3a3d38;--soft:#32352f;--sage:#a6b7a9;--accent:#b8c8ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui)}.app{width:min(650px,100%);margin:auto;padding:34px 22px 90px}.top{display:flex;justify-content:space-between;margin-bottom:62px}.brand,.date-number,.prompt,.memory-title,.recent-title,.memory,.recent-memory,.sheet h3{font-family:var(--font-reading)}.brand{font-size:31px;letter-spacing:3px}.tagline,.date-meta,.memory-note,.recent-note,.entry-time{color:var(--muted);font-size:11px}.tagline{margin-top:8px}.theme{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--text);font-size:18px}.date{text-align:center}.date-number{font-size:48px;line-height:1}.date-meta{margin-top:13px}.date-nav{display:flex;justify-content:center;gap:8px;margin-top:20px}.round{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:20px}.round:hover{background:var(--soft);color:var(--text)}.hero{margin-top:55px;text-align:center}.prompt{font-size:22px;line-height:1.6}.subprompt{font-size:12px;color:var(--muted);margin-top:6px}.record-box{margin:27px auto 0;max-width:560px;border-bottom:1px solid var(--line);display:flex;padding:4px 0 8px}.record-box input{flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:10px 5px;font-size:14px}.record-box button{border:0;background:var(--accent);color:#fff;border-radius:50%;width:34px;height:34px;font-size:17px}.today-list{display:grid;gap:2px;max-width:560px;margin:27px auto 0;text-align:left}.today-item{display:flex;gap:12px;padding:10px 4px}.dot{width:5px;height:5px;border-radius:50%;background:var(--sage);margin-top:9px}.entry-text{font-size:14px;line-height:1.75;flex:1;word-break:break-word}.entry-actions{opacity:0}.today-item:hover .entry-actions{opacity:1}.mini-btn{border:0;background:transparent;color:var(--muted);font-size:11px}.memory-section{margin-top:78px;display:none}.memory-title,.recent-title{text-align:center;font-size:20px}.memory-note,.recent-note{text-align:center;margin-top:8px}.years,.recent-list{margin-top:25px}.year-card,.recent-card{padding:20px 7px;border-top:1px solid var(--line)}.year-head{display:flex;justify-content:space-between}.year{font-size:12px;color:var(--muted)}.memory,.recent-memory{font-size:14px;line-height:1.8;margin-top:8px}.recent-section{margin-top:45px;display:none}.empty{color:var(--muted);font-size:12px;text-align:center;padding:14px 0}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(650px,100%);padding:8px 20px 20px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);text-align:center}.bottom button{border:0;background:transparent;color:var(--sage);font-size:11px}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:rgba(25,28,24,.42);display:none;align-items:flex-end;justify-content:center;padding:15px}.modal.show{display:flex}.sheet{width:min(580px,100%);background:var(--paper);border-radius:26px;padding:22px}.sheet-top{display:flex;justify-content:space-between}.sheet h3{margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.sheet textarea{width:100%;min-height:120px;margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:13px;background:var(--bg);color:var(--text);font:14px var(--font-ui)}.sheet-actions{text-align:right;margin-top:12px}.sheet-actions button{border:0;border-radius:12px;padding:10px 16px;margin-left:8px}.cancel{background:var(--soft);color:var(--text)}.save{background:var(--accent);color:#fff}@media(max-width:520px){.app{padding-top:25px}.top{margin-bottom:48px}.date-number{font-size:43px}.hero{margin-top:45px}.memory-section{margin-top:62px}}
</style>
</head>
<body>
<main class="app"><header class="top"><div><div class="brand">拾日</div><div class="tagline">拾起每一天的小事，留住时间。</div></div><button class="theme" id="theme">☼</button></header><section class="date"><div class="date-number" id="dateNumber"></div><div class="date-meta" id="dateMeta"></div><div class="date-nav"><button class="round" id="prevDay">‹</button><button class="round" id="todayBtn">·</button><button class="round" id="nextDay">›</button></div></section><section class="hero"><div class="prompt" id="prompt"></div><div class="subprompt" id="subprompt"></div><form class="record-box" id="recordForm"><input id="recordInput" maxlength="200" autocomplete="off" placeholder="记下一件此刻想留住的小事"><button aria-label="添加">＋</button></form><div class="today-list" id="todayList"></div></section><section class="memory-section" id="memorySection"><div id="yearsSection" style="display:none"><div class="memory-title">这一天，曾经留下过</div><div class="memory-note">偶尔回望就好，不必把每一年都填满。</div><div class="years" id="years"></div></div><div class="recent-section" id="recentSection"><div class="recent-title">上个月的这一天</div><div class="recent-note" id="recentNote"></div><div class="recent-list" id="recentList"></div></div></section></main><nav class="bottom"><button id="homeNav">今天</button></nav><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="sheet"><div class="sheet-top"><h3>修改这件小事</h3><button class="close" id="closeModal">×</button></div><div id="modalDate" class="date-meta"></div><textarea id="modalText" maxlength="200"></textarea><div class="sheet-actions"><button class="cancel" id="cancelModal">取消</button><button class="save" id="saveModal">保存</button></div></div></div>
<script>
const $=id=>document.getElementById(id),api=async(path='',options={})=>{const r=await fetch('/api/todos'+path,{headers:{'Content-Type':'application/json'},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d};const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},today=()=>iso(new Date()),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=s=>{const d=parse(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${new Intl.DateTimeFormat('zh-CN',{weekday:'long'}).format(d)}`};let selectedDate=today(),todos=[],editingId=null;const dayTodos=(d=selectedDate)=>todos.filter(x=>String(x.created_at||'').slice(0,10)===d);function monthBefore(s){const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)}
function renderHeader(){const a=dayTodos(),d=parse(selectedDate);$('dateNumber').textContent=`${d.getMonth()+1}月${d.getDate()}日`;$('dateMeta').textContent=fmt(selectedDate);$('prompt').textContent=a.length?'今天做了这些小事':'今天想留下些什么？';$('subprompt').textContent=a.length?`已经留下 ${a.length} 件小事`:'不必完成什么，想记就记一点。'}function actions(x){return `<div class="entry-actions"><button class="mini-btn" data-edit="${x.id}">修改</button><button class="mini-btn" data-del="${x.id}">删除</button></div>`}function renderToday(){const a=dayTodos();$('todayList').innerHTML=a.length?a.map(x=>`<div class="today-item"><span class="dot"></span><div class="entry-text">${esc(x.title)}<div class="entry-time">${esc(x.created_at||'')}</div></div>${actions(x)}</div>`).join(''):'<div class="empty">今天还没有记录。<br>也没关系，慢慢来。</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeTodo(b.dataset.del));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit))}
function renderMemories(){const d=parse(selectedDate),current=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();let html='',foundYears=0;for(let i=1;i<=Math.min(5,current-1900);i++){const y=current-i,s=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,a=todos.filter(x=>String(x.created_at||'').slice(0,10)===s);if(!a.length)continue;foundYears++;html+=`<div class="year-card"><div class="year-head"><span class="year">${y}年</span><span class="year">${a.length}件小事</span></div><div class="memory">${a.slice(0,3).map(x=>esc(x.title)).join(' · ')}</div></div>`}$('years').innerHTML=html;$('yearsSection').style.display=foundYears?'block':'none';const recentDate=monthBefore(selectedDate),recent=dayTodos(recentDate);$('recentNote').textContent=fmt(recentDate);$('recentList').innerHTML=recent.map(x=>`<div class="recent-card"><div class="recent-memory">${esc(x.title)}</div><div class="entry-time">${esc(x.created_at||'')}</div></div>`).join('');$('recentSection').style.display=recent.length?'block':'none';$('memorySection').style.display=foundYears||recent.length?'block':'none'}function render(){renderHeader();renderToday();renderMemories()}async function load(){try{todos=await api();render()}catch(e){$('todayList').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}$('recordForm').onsubmit=async e=>{e.preventDefault();const input=$('recordInput'),title=input.value.trim();if(!title)return;try{const x=await api('',{method:'POST',body:JSON.stringify({title})});todos.unshift(x);input.value='';render();toast('已记下这件小事')}catch(e){toast(e.message)}};async function removeTodo(id){try{await api('/'+id,{method:'DELETE'});todos=todos.filter(x=>String(x.id)!==String(id));render();toast('已删除')}catch(e){toast(e.message)}}function openEdit(id){const x=todos.find(t=>String(t.id)===String(id));if(!x)return;editingId=id;$('modalDate').textContent=fmt(String(x.created_at).slice(0,10));$('modalText').value=x.title;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');editingId=null}$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('saveModal').onclick=async()=>{const title=$('modalText').value.trim();if(!title)return;try{const x=await api('/'+editingId,{method:'PATCH',body:JSON.stringify({title})}),old=todos.find(t=>String(t.id)===String(editingId));if(old)Object.assign(old,x);closeModal();render();toast('已保存')}catch(e){toast(e.message)}};function move(n){const d=parse(selectedDate);d.setDate(d.getDate()+n);selectedDate=iso(d);render();scrollTo(0,0)}$('prevDay').onclick=()=>move(-1);$('nextDay').onclick=()=>move(1);$('todayBtn').onclick=()=>{selectedDate=today();render();scrollTo(0,0)};$('homeNav').onclick=()=>$('todayBtn').click();function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)}$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';$('theme').textContent=dark?'☼':'☾';localStorage.setItem('pickday-theme',dark?'':'dark')};if(localStorage.getItem('pickday-theme')==='dark'){document.documentElement.dataset.theme='dark';$('theme').textContent='☾'}load();
</script>
</body></html>
