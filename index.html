<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6f0"><title>拾日</title>
<style>
:root{--bg:#f8f6f0;--paper:#fffdf8;--text:#42463e;--muted:#a1a197;--line:#ebe8df;--soft:#f1efe8;--sage:#778b7d;--accent:#607567;--font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans",sans-serif;--font-reading:"Songti SC","Hiragino Serif SC",serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui)}.app{width:min(650px,100%);margin:0 auto;padding:30px 22px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:58px}.brand,.date-number,.prompt,.memory-title,.recent-title{font-family:var(--font-reading)}.brand{font-size:31px;letter-spacing:3px}.tagline,.date-meta,.subprompt,.memory-note,.recent-note,.empty,.entry-time,.mini-btn,.language,.round{color:var(--muted)}.top-actions{display:flex;align-items:center;gap:8px}.language{height:36px;border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:0 12px;font:12px var(--font-ui)}.date{text-align:center}.date-number{font-size:48px;line-height:1}.date-meta{margin-top:13px}.date-nav{display:flex;justify-content:center;gap:8px;margin-top:20px}.round{border:0;background:transparent;width:30px;height:30px;border-radius:50%;font-size:20px;cursor:pointer}.round:hover{background:var(--soft);color:var(--text)}.hero{margin-top:55px}.prompt{font-size:22px;line-height:1.6}.subprompt{font-size:12px;margin-top:6px}.record-box{margin:27px auto 0;max-width:560px;border-bottom:1px solid var(--line);display:flex;padding:4px 0 8px}.record-box input{flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:10px 5px;font:14px var(--font-ui)}.record-box button{border:0;background:var(--accent);color:#fff;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer}.today-list{display:grid;gap:2px;max-width:560px;margin:27px auto 0;text-align:left}.today-item{display:flex;gap:12px;padding:10px 4px}.dot{width:5px;height:5px;border-radius:50%;background:var(--sage);margin-top:9px}.entry-text{flex:1;font-size:14px;line-height:1.75;word-break:break-word}.entry-time{font-size:11px}.entry-actions{opacity:0;transition:.2s}.today-item:hover .entry-actions{opacity:1}.mini-btn{border:0;background:transparent;font-size:11px;padding:0;margin-left:4px;cursor:pointer}.empty{font-size:12px;text-align:center;padding:14px 0}.memory-section{margin-top:78px;display:none}.memory-title,.recent-title{text-align:center;font-size:20px}.memory-note,.recent-note{text-align:center;margin-top:8px}.years{margin-top:25px}.year-card,.recent-card{padding:20px 7px;border-top:1px solid var(--line)}.year-head{display:flex;justify-content:space-between}.year{font-size:12px;color:var(--muted)}.memory,.recent-memory{font-size:14px;line-height:1.8;margin-top:8px}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:12px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}@media (max-width:520px){.app{padding-top:24px}.top{margin-bottom:46px}.date-number{font-size:43px}.brand{font-size:28px}.language{max-width:92px}}
</style>
</head>
<body><main class="app"><header class="top"><div><div class="brand" id="brand">拾日</div><div class="tagline" id="tagline"></div></div><div class="top-actions"><select class="language" id="language" aria-label="Language"><option value="zh-CN">中文</option><option value="zh-TW">繁體</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div></header><section class="date"><div class="date-number" id="dateNumber"></div><div class="date-meta" id="dateMeta"></div><div class="date-nav"><button class="round" id="prevDay" aria-label="Previous day">‹</button><button class="round" id="todayBtn" aria-label="Today">◌</button><button class="round" id="nextDay" aria-label="Next day">›</button></div></section><section class="hero"><div class="prompt" id="prompt"></div><div class="subprompt" id="subprompt"></div><form class="record-box" id="recordForm"><input id="recordInput" maxlength="200" autocomplete="off" placeholder="记下一件此刻想留住的小事"><button aria-label="Add">＋</button></form><div class="today-list" id="todayList"></div></section><section class="memory-section" id="memorySection"><div class="memory-title" id="yearsTitle"></div><div class="memory-note" id="yearsNote"></div><div class="years" id="years"></div><div class="recent-section" id="recentSection"><div class="recent-title" id="recentTitle"></div><div class="recent-note" id="recentNote"></div><div class="recent-list" id="recentList"></div></div></section></main><div class="toast" id="toast"></div><script>
const $=id=>document.getElementById(id),api=async(path='',options={})=>{const r=await fetch('/api/todos'+path,{headers:{'Content-Type':'application/json'},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d},I18N={'zh-CN':{brand:'拾日',tag:'拾起每一天的小事，留住时间。',input:'记下一件此刻想留住的小事',add:'添加',today:'今天',empty:'今天还没有记录。<br>也没关系，慢慢记录。',prompt:'今天有什么小事，值得被轻轻记住？',sub:'慢一点，认真一点。',years:'往年',note:'一页一页，岁月都被记住了。',recent:'最近',recentNote:'最近一段时间的记忆。',edit:'编辑',deleted:'删除',cancel:'取消',save:'保存',changed:'已保存',added:'已添加',deletedText:'已删除',prev:'上一天',next:'下一天',home:'今天'},'zh-TW':{brand:'拾日',tag:'拾起每一天的小事，留住時間。',input:'記下一件此刻想留住的小事',add:'新增',today:'今天',empty:'今天還沒有記錄。<br>也沒關係，慢慢記。',prompt:'今天有什麼小事，值得被輕輕記住？',sub:'慢一點，認真一點。',years:'往年',note:'一頁一頁，歲月都被記住了。',recent:'最近',recentNote:'最近一段時間的記憶。',edit:'編輯',deleted:'刪除',cancel:'取消',save:'儲存',changed:'已保存',added:'已新增',deletedText:'已刪除',prev:'上一天',next:'下一天',home:'今天'},en:{brand:'Pick Day',tag:'Collect the small moments that make a day.',input:'Write down one small thing worth keeping',add:'Add',today:'Today',empty:'Nothing recorded today.<br>That is okay. Take your time.',prompt:'What small thing from today is worth keeping?',sub:'Be gentle and slow.',years:'Years',note:'Each page holds a little memory.',recent:'Recent',recentNote:'The recent moments you have kept.',edit:'Edit',deleted:'Delete',cancel:'Cancel',save:'Save',changed:'Saved',added:'Added',deletedText:'Deleted',prev:'Previous day',next:'Next day',home:'Today'},ja:{brand:'拾日',tag:'毎日の小さなことを、きちんと残す。',input:'今の気持ちを一言で残す',add:'追加',today:'今日',empty:'今日はまだ記録がありません。<br>大丈夫、ゆっくりでいいです。',prompt:'今日のどんな小さなことを大切に残したいですか？',sub:'ゆっくり、丁寧に。',years:'過去',note:'ページをめくるたびに、時間が残ります。',recent:'最近',recentNote:'最近の記憶を覗いてみましょう。',edit:'編集',deleted:'削除',cancel:'キャンセル',save:'保存',changed:'保存しました',added:'追加しました',deletedText:'削除しました',prev:'前の日',next:'次の日',home:'今日'},ko:{brand:'拾일',tag:'하루의 작은 순간을 남겨두다.',input:'지금 떠오르는 한 가지를 적어보세요',add:'추가',today:'오늘',empty:'오늘은 아직 기록이 없어요.<br>천천히 적어도 괜찮아요.',prompt:'오늘 어떤 작은 것이 기억할 만한 가치가 있나요?',sub:'조금 천천히, 진심으로.',years:'연도별',note:'한 장씩 쌓인 시간들이 기록됩니다.',recent:'최근',recentNote:'최근에 남긴 순간들을 돌아봅니다.',edit:'수정',deleted:'삭제',cancel:'취소',save:'저장',changed:'저장됨',added:'추가됨',deletedText:'삭제됨',prev:'이전 날',next:'다음 날',home:'오늘'}};function lang(){return localStorage.getItem('pickday-lang')||'zh-CN'}function t(){return I18N[lang()]||I18N['zh-CN']}function holiday(s){const d=parse(s),md=`${d.getMonth()+1}-${d.getDate()}`,y=d.getFullYear();return {month:md,year:y}}function parse(s){const d=s&&s.includes('-')?new Date(`${s}T00:00:00`):new Date();return Number.isNaN(d.getTime())?new Date():d}function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}let selectedDate=today(),todos=[],editingId=null;const dayTodos=(d=selectedDate)=>todos.filter(x=>String(x.created_at||'').slice(0,10)===d);function monthBefore(s){const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.toISOString().slice(0,10)}function renderHeader(){const a=dayTodos(),d=parse(selectedDate),q=t();$('brand').textContent=q.brand;$('tagline').textContent=q.tag;$('dateNumber').textContent=new Intl.DateTimeFormat(lang(),{month:'long',day:'numeric'}).format(d);$('dateMeta').textContent=new Intl.DateTimeFormat(lang(),{year:'numeric',month:'long',day:'numeric'}).format(d);$('prompt').textContent=q.prompt;$('subprompt').textContent=q.sub;$('recordInput').placeholder=q.input;document.title=q.brand;$('language').value=lang()}function actions(x){return `<div class="entry-actions"><button class="mini-btn" data-edit="${x.id}">${t().edit}</button><button class="mini-btn" data-del="${x.id}">${t().deleted}</button></div>`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderToday(){const a=dayTodos();$('todayList').innerHTML=a.length?`<div class="empty">${t().empty}</div>`:a.map(x=>`<div class="today-item"><span class="dot"></span><div class="entry-text">${esc(x.title)}</div>${actions(x)}</div>`).join('');if(!a.length){$('todayList').innerHTML=`<div class="empty">${t().empty}</div>`;return}$('todayList').innerHTML=a.map(x=>`<div class="today-item"><span class="dot"></span><div class="entry-text">${esc(x.title)}</div>${actions(x)}</div>`).join('')}function render(){renderHeader();renderToday()}async function load(){try{todos=await api();render()}catch(e){$('todayList').innerHTML=`<div class="empty">${t().empty}</div>`}}$('recordForm').addEventListener('submit',async e=>{e.preventDefault();const input=$('recordInput'),title=input.value.trim();if(!title)return;try{const x=await api('',{method:'POST',body:JSON.stringify({title})});todos.unshift(x);input.value='';render();document.getElementById('toast').textContent=t().added;document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1800)}catch(e){document.getElementById('toast').textContent=e.message||t().added;document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1800)}});document.addEventListener('click',async e=>{const editBtn=e.target.closest('[data-edit]');if(editBtn){const id=Number(editBtn.dataset.edit);const item=todos.find(x=>Number(x.id)===id);if(!item)return;const value=window.prompt(t().edit,item.title);if(value===null)return;const next=value.trim();if(!next)return;try{const x=await api(`/${id}`,{method:'PATCH',body:JSON.stringify({title:next})});Object.assign(item,x);render();document.getElementById('toast').textContent=t().changed;document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1800)}catch(err){document.getElementById('toast').textContent=err.message||t().changed;document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1800)}}const delBtn=e.target.closest('[data-del]');if(delBtn){const id=Number(delBtn.dataset.del);try{await api(`/${id}`,{method:'DELETE'});todos=todos.filter(x=>Number(x.id)!==id);render();document.getElementById('toast').textContent=t().deletedText;document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1800)}catch(err){document.getElementById('toast').textContent=err.message||t().deletedText;document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1800)}}});document.getElementById('language').addEventListener('change',e=>{localStorage.setItem('pickday-lang',e.target.value);document.documentElement.lang=e.target.value;render()});document.getElementById('prevDay').addEventListener('click',()=>{const d=parse(selectedDate);d.setDate(d.getDate()-1);selectedDate=d.toISOString().slice(0,10);render()});document.getElementById('nextDay').addEventListener('click',()=>{const d=parse(selectedDate);d.setDate(d.getDate()+1);selectedDate=d.toISOString().slice(0,10);render()});document.getElementById('todayBtn').addEventListener('click',()=>{selectedDate=today();render()});load();</script></body></html>
