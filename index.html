<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f0">
  <title>拾日</title>
  <style>
    :root {
      --bg:#f8f6f0; --paper:#fffdf8; --text:#42463e; --muted:#a1a197; --line:#ebe8df;
      --soft:#f1efe8; --sage:#778b7d; --accent:#607567;
      --font-ui:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui);
    }
    .app { max-width: 680px; margin: 0 auto; padding: 28px 22px 90px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 58px; }
    .brand { font-size: 31px; letter-spacing: 3px; }
    .tagline { margin-top: 8px; color: var(--muted); font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .language {
      height: 36px; border: 1px solid var(--line); border-radius: 18px;
      background: var(--paper); color: var(--text); padding: 0 12px; font: 12px var(--font-ui);
    }
    .theme {
      border: 1px solid var(--line); border-radius: 50%; width: 36px; height: 36px;
      background: var(--paper); color: var(--text); font-size: 18px; cursor: pointer;
    }
    .date { text-align: center; }
    .date-number { font-size: 48px; line-height: 1; }
    .date-meta { margin-top: 13px; color: var(--muted); }
    .date-nav { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
    .round {
      border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px;
      border-radius: 50%; font-size: 20px; cursor: pointer;
    }
    .round:hover { background: var(--soft); color: var(--text); }
    .hero { margin-top: 55px; }
    .prompt { font-size: 22px; line-height: 1.6; }
    .subprompt { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .record-box {
      margin: 27px auto 0; max-width: 560px; border-bottom: 1px solid var(--line);
      display: flex; padding: 4px 0 8px;
    }
    .record-box input {
      flex: 1; border: 0; outline: none; background: transparent; color: var(--text);
      padding: 10px 5px; font: 14px var(--font-ui);
    }
    .record-box button {
      border: 0; background: var(--accent); color: #fff; border-radius: 50%; width: 36px; height: 36px;
      font-size: 17px; cursor: pointer;
    }
    .today-list { display: grid; gap: 2px; max-width: 560px; margin: 27px auto 0; text-align: left; }
    .today-item {
      display: flex; gap: 12px; padding: 10px 4px; border-bottom: 1px solid transparent;
    }
    .today-item:hover { border-color: var(--line); }
    .dot {
      width: 5px; height: 5px; border-radius: 50%; background: var(--sage); margin-top: 9px;
    }
    .entry-text { flex: 1; font-size: 14px; line-height: 1.75; word-break: break-word; }
    .entry-time { color: var(--muted); font-size: 11px; }
    .entry-actions { opacity: 0; transition: opacity .2s; }
    .today-item:hover .entry-actions { opacity: 1; }
    .mini-btn {
      border: 0; background: transparent; color: var(--muted); font-size: 11px; padding: 0; margin-left: 4px; cursor: pointer;
    }
    .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 0; }
    .memory-section { margin-top: 78px; display: none; }
    .memory-title, .recent-title { text-align: center; font-size: 20px; }
    .memory-note, .recent-note { text-align: center; margin-top: 8px; color: var(--muted); }
    .years { margin-top: 25px; }
    .year-card { padding: 20px 7px; border-top: 1px solid var(--line); }
    .year-head { display: flex; justify-content: space-between; }
    .year { font-size: 12px; color: var(--muted); }
    .memory { font-size: 14px; line-height: 1.8; margin-top: 8px; }
    .recent-list { margin-top: 25px; }
    .recent-card {
      padding: 20px 7px; border-top: 1px solid var(--line);
    }
    .recent-memory { font-size: 14px; line-height: 1.8; }
    .entry-time { margin-top: 4px; }
    .toast {
      position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 9px 15px; border-radius: 12px;
      font-size: 12px; opacity: 0; transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 520px) {
      .app { padding-top: 24px; }
      .top { margin-bottom: 46px; }
      .date-number { font-size: 43px; }
      .brand { font-size: 28px; }
      .language { max-width: 92px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <div class="brand" id="brand">拾日</div>
        <div class="tagline" id="tagline"></div>
      </div>
      <div class="top-actions">
        <select class="language" id="language" aria-label="Language">
          <option value="zh-CN">中文</option>
          <option value="zh-TW">繁體</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
        <button class="theme" id="theme" aria-label="Theme">◐</button>
      </div>
    </header>

    <section class="date">
      <div class="date-number" id="dateNumber"></div>
      <div class="date-meta" id="dateMeta"></div>
      <div class="date-nav">
        <button class="round" id="prevDay" aria-label="Previous day">‹</button>
        <button class="round" id="todayBtn" aria-label="Today">◌</button>
        <button class="round" id="nextDay" aria-label="Next day">›</button>
      </div>
    </section>

    <section class="hero">
      <div class="prompt" id="prompt"></div>
      <div class="subprompt" id="subprompt"></div>
      <form class="record-box" id="recordForm">
        <input id="recordInput" maxlength="200" autocomplete="off" placeholder="记下一件此刻想留住的小事">
        <button aria-label="Add">＋</button>
      </form>
      <div class="today-list" id="todayList"></div>
    </section>

    <section class="memory-section" id="memorySection">
      <div class="memory-title" id="yearsTitle"></div>
      <div class="memory-note" id="yearsNote"></div>
      <div class="years" id="years"></div>
      <div class="recent-section" id="recentSection">
        <div class="recent-title" id="recentTitle"></div>
        <div class="recent-note" id="recentNote"></div>
        <div class="recent-list" id="recentList"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    const I18N = {
      'zh-CN': {
        brand: '拾日',
        tag: '拾起每一天的小事，留住时间。',
        input: '记下一件此刻想留住的小事',
        add: '添加',
        today: '今天',
        empty: '今天还没有记录。<br>也没关系，慢慢记录。',
        prompt: '今天有什么小事，值得被轻轻记住？',
        sub: '慢一点，认真一点。',
        years: '往年',
        note: '一页一页，岁月都被记住了。',
        recent: '最近',
        recentNote: '最近一段时间的记忆。',
        edit: '编辑',
        deleted: '删除',
        cancel: '取消',
        save: '保存',
        changed: '已保存',
        added: '已添加',
        deletedText: '已删除',
        prev: '上一天',
        next: '下一天',
        home: '今天',
      },
      'zh-TW': {
        brand: '拾日',
        tag: '拾起每一天的小事，留住時間。',
        input: '記下一件此刻想留住的小事',
        add: '新增',
        today: '今天',
        empty: '今天還沒有記錄。<br>也沒關係，慢慢記。',
        prompt: '今天有什麼小事，值得被輕輕記住？',
        sub: '慢一點，認真一點。',
        years: '往年',
        note: '一頁一頁，歲月都被記住了。',
        recent: '最近',
        recentNote: '最近一段時間的記憶。',
        edit: '編輯',
        deleted: '刪除',
        cancel: '取消',
        save: '儲存',
        changed: '已保存',
        added: '已新增',
        deletedText: '已刪除',
        prev: '上一天',
        next: '下一天',
        home: '今天',
      },
      en: {
        brand: 'Pick Day',
        tag: 'Collect the small moments that make a day.',
        input: 'Write down one small thing worth keeping',
        add: 'Add',
        today: 'Today',
        empty: 'Nothing recorded today.<br>That is okay. Take your time.',
        prompt: 'What small thing from today is worth keeping?',
        sub: 'Be gentle and slow.',
        years: 'Years',
        note: 'Each page holds a little memory.',
        recent: 'Recent',
        recentNote: 'The recent moments you have kept.',
        edit: 'Edit',
        deleted: 'Delete',
        cancel: 'Cancel',
        save: 'Save',
        changed: 'Saved',
        added: 'Added',
        deletedText: 'Deleted',
        prev: 'Previous day',
        next: 'Next day',
        home: 'Today',
      },
      ja: {
        brand: '拾日',
        tag: '毎日の小さなことを、きちんと残す。',
        input: '今の気持ちを一言で残す',
        add: '追加',
        today: '今日',
        empty: '今日はまだ記録がありません。<br>大丈夫、ゆっくりでいいです。',
        prompt: '今日のどんな小さなことを大切に残したいですか？',
        sub: 'ゆっくり、丁寧に。',
        years: '過去',
        note: 'ページをめくるたびに、時間が残ります。',
        recent: '最近',
        recentNote: '最近の記憶を覗いてみましょう。',
        edit: '編集',
        deleted: '削除',
        cancel: 'キャンセル',
        save: '保存',
        changed: '保存しました',
        added: '追加しました',
        deletedText: '削除しました',
        prev: '前の日',
        next: '次の日',
        home: '今日',
      },
      ko: {
        brand: '拾일',
        tag: '하루의 작은 순간을 남겨두다.',
        input: '지금 떠오르는 한 가지를 적어보세요',
        add: '추가',
        today: '오늘',
        empty: '오늘은 아직 기록이 없어요.<br>천천히 적어도 괜찮아요.',
        prompt: '오늘 어떤 작은 것이 기억할 만한 가치가 있나요?',
        sub: '조금 천천히, 진심으로.',
        years: '연도별',
        note: '한 장씩 쌓인 시간들이 기록됩니다.',
        recent: '최근',
        recentNote: '최근에 남긴 순간들을 돌아봅니다.',
        edit: '수정',
        deleted: '삭제',
        cancel: '취소',
        save: '저장',
        changed: '저장됨',
        added: '추가됨',
        deletedText: '삭제됨',
        prev: '이전 날',
        next: '다음 날',
        home: '오늘',
      }
    };

    function lang() {
      return localStorage.getItem('pickday-lang') || 'zh-CN';
    }

    function t() {
      return I18N[lang()] || I18N['zh-CN'];
    }

    function fmt(dateString) {
      const d = new Date(dateString);
      return new Intl.DateTimeFormat(lang(), { year: 'numeric', month: 'long', day: 'numeric' }).format(d);
    }

    function parse(str) {
      const s = String(str || '').slice(0, 10);
      if (!s || s === 'Invalid Date') return new Date();
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function today() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function renderHeader() {
      const q = t();
      const d = parse(today());
      $('brand').textContent = q.brand;
      $('tagline').textContent = q.tag;
      $('dateNumber').textContent = new Intl.DateTimeFormat(lang(), { month: 'long', day: 'numeric' }).format(d);
      $('dateMeta').textContent = fmt(today());
      $('prompt').textContent = q.prompt;
      $('subprompt').textContent = q.sub;
      $('recordInput').placeholder = q.input;
      document.title = q.brand;
      $('language').value = lang();
    }

    function toast(msg) {
      const n = $('toast');
      n.textContent = msg;
      n.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => n.classList.remove('show'), 1800);
    }

    let selectedDate = today();
    let todos = [];

    function dayTodos(date = selectedDate) {
      return todos.filter((x) => String(x.created_at || '').slice(0, 10) === date);
    }

    function renderToday() {
      const items = dayTodos();
      if (!items.length) {
        $('todayList').innerHTML = `<div class="empty">${t().empty}</div>`;
        return;
      }
      $('todayList').innerHTML = items.map((x) => `
        <div class="today-item">
          <span class="dot"></span>
          <div class="entry-text">${x.title}</div>
          <div class="entry-actions">
            <button class="mini-btn" data-edit="${x.id}">${t().edit}</button>
            <button class="mini-btn" data-del="${x.id}">${t().deleted}</button>
          </div>
        </div>
      `).join('');
    }

    function render() {
      renderHeader();
      renderToday();
    }

    function saveTodo() {
      const input = $('recordInput');
      const title = input.value.trim();
      if (!title) return;
      todos.push({
        id: Date.now(),
        title,
        created_at: selectedDate + 'T12:00:00.000Z'
      });
      input.value = '';
      render();
      toast(t().added);
    }

    document.getElementById('recordForm').addEventListener('submit', (e) => {
      e.preventDefault();
      saveTodo();
    });

    document.getElementById('language').addEventListener('change', (e) => {
      const v = e.target.value;
      localStorage.setItem('pickday-lang', v);
      document.documentElement.lang = v;
      render();
    });

    document.getElementById('theme').addEventListener('click', () => {
      const dark = document.body.dataset.theme === 'dark';
      document.body.dataset.theme = dark ? 'light' : 'dark';
      const root = document.documentElement;
      root.style.setProperty('--bg', dark ? '#f8f6f0' : '#1e211e');
      root.style.setProperty('--paper', dark ? '#fffdf8' : '#292c28');
      root.style.setProperty('--text', dark ? '#42463e' : '#eeead0');
      root.style.setProperty('--muted', dark ? '#a1a197' : '#9a9c95');
      root.style.setProperty('--line', dark ? '#ebe8df' : '#3a3d38');
      root.style.setProperty('--soft', dark ? '#f1efe8' : '#32352f');
      root.style.setProperty('--sage', dark ? '#778b7d' : '#a6b7a9');
      root.style.setProperty('--accent', dark ? '#607567' : '#b8c8bf');
      $('theme').textContent = dark ? '◐' : '◑';
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      selectedDate = today();
      render();
    });

    document.getElementById('prevDay').addEventListener('click', () => {
      const d = parse(selectedDate);
      d.setDate(d.getDate() - 1);
      selectedDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      render();
    });

    document.getElementById('nextDay').addEventListener('click', () => {
      const d = parse(selectedDate);
      d.setDate(d.getDate() + 1);
      selectedDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      render();
    });

    document.addEventListener('click', (e) => {
      const editBtn = e.target.closest('[data-edit]');
      if (editBtn) {
        const id = Number(editBtn.getAttribute('data-edit'));
        const item = todos.find((x) => Number(x.id) === id);
        if (!item) return;
        const value = window.prompt(t().edit, item.title);
        if (value === null) return;
        item.title = value.trim();
        if (!item.title) return;
        render();
        toast(t().changed);
      }

      const delBtn = e.target.closest('[data-del]');
      if (delBtn) {
        const id = Number(delBtn.getAttribute('data-del'));
        todos = todos.filter((x) => Number(x.id) !== id);
        render();
        toast(t().deletedText);
      }
    });

    render();
  </script>
</body>
</html>
